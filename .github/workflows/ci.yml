name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q config.py state_store.py ingest.py transform.py fetch_list.py scripts dags

      # No credentials needed: the suite stubs the network and asserts on
      # generated SQL rather than executing it.
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Belt-and-braces against the one mistake this repo most needs to avoid.
      - name: Fail if a service-account key is tracked
        run: |
          if git ls-files | grep -EI '(gcp_keys|credentials|service-account).*\.json$|^\.env$'; then
            echo "::error::A credential file is tracked in git"
            exit 1
          fi
          echo "No credential files tracked."

      - name: Fail on private keys in tracked content
        run: |
          if git grep -lI -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!*.md'; then
            echo "::error::A private key is committed"
            exit 1
          fi
          echo "No private keys found."
